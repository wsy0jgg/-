<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>제주도 여행 8.6-8.8</title>

<!-- PWA: 홈 화면에 추가하면 앱처럼 열립니다 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#171F2B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="제주여행">
<style>
  :root{
    --basalt: #171F2B;
    --basalt-2: #1F2A3A;
    --basalt-3: #283548;
    --tangerine: #F2803C;
    --tangerine-dim: #C96A30;
    --sand: #F3ECDD;
    --sand-dim: #B9B2A2;
    --ocean: #3E8F8A;
    --gold: #E0B15C;
    --coral: #E1637A;
    --violet: #B8A8D6;
    --skyblue: #5B9BD5;
    --leaf: #6FB88A;
    --line: rgba(243,236,221,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; overflow-x:hidden; max-width:100vw;}
  body{
    background: var(--basalt);
    color: var(--sand);
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    min-height:100vh;
    padding-bottom: 40px;
  }
  .hero{
    padding: 32px 20px 22px;
    background:
      radial-gradient(circle at 85% -10%, rgba(242,128,60,0.25), transparent 55%),
      var(--basalt);
    border-bottom: 1px solid var(--line);
    position: relative;
    overflow: hidden;
  }
  .hero::after{
    content:"";
    position:absolute;
    right:-30px; bottom:-60px;
    width:180px; height:180px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(62,143,138,0.35), transparent 70%);
  }
  .eyebrow{
    font-size: 13.3px;
    letter-spacing:2px;
    color: var(--tangerine);
    font-weight:700;
    text-transform:uppercase;
  }
  h1{
    font-size: 29.3px;
    margin: 8px 0 4px;
    font-weight: 800;
    letter-spacing:-0.5px;
  }
  .subdate{
    color: var(--sand-dim);
    font-size: 15.3px;
  }

  /* ---- 날씨 위젯 ---- */
  .weather-widget{
    margin-top: 14px;
    display:flex;
    gap: 8px;
    overflow-x:auto;
  }
  .weather-loading{
    font-size: 13.3px;
    color: var(--sand-dim);
  }
  .weather-current{
    display:flex;
    align-items:center;
    gap: 10px;
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 16px;
    flex-shrink:0;
  }
  .weather-current .wc-icon{ font-size: 26px; }
  .weather-current .wc-temp{ font-size: 20px; font-weight:800; }
  .weather-current .wc-label{ font-size: 11.3px; color: var(--sand-dim); }
  .weather-day{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 2px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 12px;
    flex-shrink:0;
    min-width: 62px;
  }
  .weather-day .wd-label{ font-size: 11px; color: var(--sand-dim); font-weight:700; }
  .weather-day .wd-icon{ font-size: 20px; margin: 2px 0; }
  .weather-day .wd-temp{ font-size: 12.3px; font-weight:700; }
  .weather-day .wd-temp .lo{ color: var(--sand-dim); font-weight:600; }
  .weather-day .wd-rain{ font-size: 10.5px; color: var(--skyblue); }

  /* ---- 뒤로가기 바 ---- */
  .topbar{
    display:none;
    align-items:center;
    gap: 10px;
    padding: 16px 20px 0;
  }
  .topbar.show{ display:flex; }
  .back-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background: var(--basalt-2);
    border: 1px solid var(--line);
    color: var(--sand);
    font-size: 14.3px;
    font-weight:700;
    padding: 8px 14px 8px 10px;
    border-radius: 100px;
    cursor:pointer;
  }
  .back-btn:active{ background: var(--basalt-3); }
  .topbar .view-title{
    font-size: 16.3px;
    font-weight:800;
  }
  .quick-tabs{
    display:none;
    gap:6px;
    padding: 10px 20px 0;
    overflow-x:auto;
  }
  .quick-tabs.show{ display:flex; }
  .qtab{
    flex-shrink:0;
    padding: 7px 13px;
    border-radius: 100px;
    background: var(--basalt-2);
    border: 1px solid var(--line);
    font-size: 13.8px;
    font-weight:700;
    color: var(--sand-dim);
    cursor:pointer;
  }
  .qtab.active{
    background: var(--tangerine);
    color: #1B0F06;
    border-color: var(--tangerine);
  }

  /* ---- 홈 화면 카드 ---- */
  .home-grid{
    padding: 18px 20px 0;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .nav-card{
    position:relative;
    overflow:hidden;
    border-radius: 18px;
    padding: 18px 16px;
    border: 1px solid var(--line);
    cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease;
    min-height: 108px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    box-shadow: 0 4px 14px rgba(0,0,0,0.14);
  }
  .nav-card:active{ transform: scale(0.97); box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
  .icon-badge{
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(255,255,255,0.10);
    flex-shrink:0;
  }
  .nav-card .lbl{ font-size: 16.3px; font-weight:800; margin-top:10px; }
  .nav-card .sub{ font-size: 13.3px; color: var(--sand-dim); margin-top:2px; }
  .nav-card .count{
    position:absolute;
    top:14px; right:14px;
    font-size: 12.3px;
    font-weight:800;
    background: rgba(0,0,0,0.22);
    padding: 3px 9px;
    border-radius: 100px;
  }
  .nc-d1{ background: linear-gradient(150deg, rgba(242,128,60,0.30), var(--basalt-2)); }
  .nc-d1 .icon-badge{ color: var(--tangerine); }
  .nc-d2{ background: linear-gradient(150deg, rgba(62,143,138,0.30), var(--basalt-2)); }
  .nc-d2 .icon-badge{ color: var(--ocean); }
  .nc-d3{ background: linear-gradient(150deg, rgba(224,177,92,0.28), var(--basalt-2)); }
  .nc-d3 .icon-badge{ color: var(--gold); }
  .nc-pk{ background: linear-gradient(150deg, rgba(225,99,122,0.28), var(--basalt-2)); }
  .nc-pk .icon-badge{ color: var(--coral); }
  .nc-note{ background: linear-gradient(150deg, rgba(91,155,213,0.26), var(--basalt-2)); }
  .nc-note .icon-badge{ color: var(--skyblue); }
  .nc-route{ background: linear-gradient(150deg, rgba(95,168,117,0.26), var(--basalt-2)); }
  .nc-route .icon-badge{ color: var(--leaf); }
  .nc-airport{ background: linear-gradient(150deg, rgba(224,177,92,0.26), var(--basalt-2)); }
  .nc-airport .icon-badge{ color: var(--gold); }
  .nc-overview-top{
    grid-column: 1 / -1;
    background: linear-gradient(150deg, rgba(184,178,214,0.30), var(--basalt-2));
  }
  .nc-overview-top .icon-row{ display:flex; align-items:center; gap:14px; }
  .nc-overview-top .lbl{ margin-top:0; }
  .nc-overview-top .icon-badge{ color: var(--violet); width:50px; height:50px; }
  .nc-pk .icon-row{ display:flex; align-items:center; gap:10px; }
  .nc-pk .lbl{ margin-top:0; }

  .home-utils{
    padding: 6px 20px 0;
  }
  .menu-admin-link{
    text-align:center;
    font-size: 12.8px;
    color: var(--sand-dim);
    padding: 14px 10px 4px;
    cursor:pointer;
  }
  .menu-admin-link:active{ color: var(--sand); }

  /* ---- 메뉴 순서·표시 관리 ---- */
  .madmin-row{
    display:flex;
    align-items:center;
    gap: 12px;
    background: var(--basalt-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .madmin-row.is-hidden{ opacity: 0.45; }
  .madmin-icon{ font-size: 17px; display:flex; align-items:center; }
  .madmin-icon svg{ width:20px; height:20px; }
  .madmin-label{ font-size: 14px; font-weight:700; flex:1; }
  .madmin-controls{ display:flex; align-items:center; gap: 6px; }
  .madmin-btn{
    width: 30px; height:30px;
    border-radius: 8px;
    background: var(--basalt-3);
    border: 1px solid var(--line);
    color: var(--sand);
    font-size: 12px;
    cursor:pointer;
  }
  .madmin-btn:disabled{ opacity:0.3; cursor:default; }
  .madmin-toggle{
    font-size: 11.5px;
    font-weight:700;
    padding: 7px 12px;
    border-radius: 100px;
    background: var(--basalt-3);
    border: 1px solid var(--line);
    color: var(--sand-dim);
    cursor:pointer;
  }
  .madmin-toggle.on{
    background: var(--ocean);
    color: #0E211F;
    border-color: var(--ocean);
  }
  .madmin-hint{
    font-size: 12px;
    color: var(--sand-dim);
    line-height:1.6;
    margin-top: 12px;
  }

  /* ---- 전체일정 (타임라인) ---- */
  .tl-day{ margin-bottom: 22px; }
  .tl-day-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom: 10px;
  }
  .tl-day-badge{
    font-size: 12.8px;
    font-weight:800;
    padding: 4px 11px;
    border-radius: 100px;
    background: var(--basalt-3);
  }
  .tl-day-date{ font-size: 13.3px; color: var(--sand-dim); }
  .tl-line{
    position:relative;
    padding-left: 20px;
  }
  .tl-row{
    position:relative;
    padding: 0 0 24px 0;
  }
  .tl-row::before{
    content:"";
    position:absolute;
    left: -20px; top: 5px;
    width: 8px; height:8px;
    border-radius:50%;
    background: var(--dot-color, var(--tangerine));
  }
  .tl-row::after{
    content:"";
    position:absolute;
    left: -17px; top: 15px;
    width: 1px;
    bottom: 6px;
    background: var(--line);
  }
  .tl-row:last-child::after{ display:none; }
  .tl-row .tl-time{ font-size: 13.3px; font-weight:700; color: var(--sand-dim); }
  .tl-row .tl-name{ font-size: 15.3px; font-weight:600; margin-top:1px; }
  .tl-row .tl-loc{ font-size: 12.8px; color: var(--ocean); margin-top:1px; }
  .tl-row .tl-memo{ font-size: 12.3px; color: var(--sand-dim); margin-top:2px; }
  .ov-panel-body .tl-row .tl-time{ font-size: 14px; }
  .ov-panel-body .tl-row .tl-name{ font-size: 16.5px; font-weight:700; }
  .ov-panel-body .tl-row .tl-loc{ font-size: 13px; }
  .ov-panel-body .tl-row .tl-memo{ font-size: 12.5px; }

  .ov-extra{
    display:flex;
    flex-direction:column;
    gap: 10px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .ov-collapse{
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow:hidden;
    background: var(--basalt-2);
  }
  .ov-collapse-head{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 12px 14px;
    cursor:pointer;
  }
  .ov-collapse-icon{ font-size: 15px; }
  .ov-collapse-title{ font-size: 14px; font-weight:700; flex:1; }
  .ov-collapse-chevron{ font-size: 10px; color: var(--sand-dim); }
  .ov-collapse-body{ padding: 0 14px 14px; }
  .ov-daybtns{
    display:flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .ov-daybtn{
    flex:1;
    text-align:center;
    padding: 10px 8px;
    border-radius: 10px;
    background: var(--basalt-2);
    border: 1px solid var(--line);
    font-size: 14.3px;
    font-weight:700;
    color: var(--sand-dim);
    cursor:pointer;
  }
  .ov-daybtn.active{
    background: var(--tab-color);
    color: #1B0F06;
    border-color: var(--tab-color);
  }
  .ov-panels{
    display:flex;
    gap: 10px;
    height: min(640px, 74vh);
  }
  .ov-panels.expanded{
    height: min(760px, 84vh);
  }
  .ov-panel{
    border: 1.5px solid var(--tab-color, var(--line));
    border-radius: 16px;
    background: var(--basalt-2);
    overflow:hidden;
    flex: 0 0 15%;
    cursor:pointer;
    transition: flex-basis .22s ease;
  }
  .ov-panel.open{
    flex: 1 1 auto;
    border-color: var(--tab-color, var(--line));
    cursor:default;
  }
  .ov-panels{ overflow-x: auto; }
  .ov-panels.equal .ov-panel{ flex: 1 1 0; min-width: 320px; }
  .ov-panel-collapsed{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 8px;
    writing-mode: vertical-rl;
    font-size: 15.3px;
    font-weight:800;
    color: var(--tab-color);
    padding: 14px 0;
  }
  .ov-panel-collapsed .ov-panel-date,
  .ov-panel-collapsed .ov-panel-count{
    font-size: 12.3px;
    font-weight:600;
    color: var(--sand-dim);
    writing-mode: vertical-rl;
  }
  .ov-panels.equal .ov-panel-collapsed{
    writing-mode: horizontal-tb;
    padding: 16px 10px;
    justify-content:flex-start;
    gap: 6px;
  }
  .ov-panels.equal .ov-panel-collapsed .ov-panel-date,
  .ov-panels.equal .ov-panel-collapsed .ov-panel-count{
    writing-mode: horizontal-tb;
  }
  .ov-panels.equal .ov-panel-collapsed .ov-panel-count{
    background: var(--basalt-3);
    padding: 3px 9px;
    border-radius: 100px;
    margin-top: 4px;
  }
  .ov-panel-head{
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--line);
    display:flex;
    align-items:center;
    gap: 8px;
    cursor:pointer;
  }
  .ov-panel-badge{
    font-size: 17px;
    font-weight:800;
    color: var(--tab-color);
  }
  .ov-panel-head .ov-panel-date{ font-size: 13px; color: var(--sand-dim); }
  .ov-panel-close{
    margin-left:auto;
    font-size: 13.3px;
    color: var(--sand-dim);
  }
  .ov-panel-body{
    padding: 8px 22px 22px;
    height: calc(100% - 66px);
    overflow-y: auto;
    cursor:default;
  }
  .ov-panel-body .tl-line{ padding-top: 16px; max-width: 560px; }

  /* ---- 전체일정 내 아이템 리스트 (컴팩트 + 확장) ---- */
  .ovi-list{ padding-top: 6px; }
  .ovi-row{
    border-radius: 10px;
    padding: 2px 4px;
    margin-bottom: 2px;
    cursor:pointer;
  }
  .ovi-row.open{
    background: var(--basalt-3);
    padding: 6px 10px;
    margin-bottom: 6px;
  }
  .ovi-head{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 7px 6px;
  }
  .ovi-row.open .ovi-head{ padding: 3px 0 4px; }
  .ovi-dot{
    width:6px; height:6px;
    border-radius:50%;
    background: var(--tab-color);
    flex-shrink:0;
  }
  .ovi-time{ font-size: 13.3px; font-weight:700; color: var(--sand-dim); min-width:38px; }
  .ovi-name{ font-size: 14.8px; font-weight:600; flex:1; }
  .ovi-row.open .ovi-name{ font-size: 16.8px; font-weight:800; }
  .ovi-arrow{ font-size: 11.3px; color: var(--sand-dim); }
  .ovi-detail{ padding: 2px 6px 6px 20px; }
  .ovi-empty{
    text-align:center;
    color: var(--sand-dim);
    font-size: 14.3px;
    padding: 16px 0;
  }

  /* ---- 메모 ---- */
  .note-card{
    background: linear-gradient(150deg, rgba(225,99,122,0.10), var(--basalt-2));
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
  }
  .note-header{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .note-header-icon{
    width: 30px; height:30px;
    border-radius: 9px;
    background: rgba(225,99,122,0.22);
    display:flex; align-items:center; justify-content:center;
    font-size: 16.3px;
  }
  .note-header-title{ font-size: 16.3px; font-weight:800; }
  .note-list{ display:flex; flex-direction:column; gap: 8px; }
  .note-item{
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--basalt-3);
    border-radius: 10px;
    padding: 4px 6px 4px 4px;
  }
  .note-num{
    width: 22px; height:22px;
    border-radius: 50%;
    background: var(--coral);
    color: #2A0E14;
    font-size: 12.8px;
    font-weight:800;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .note-input{
    flex:1;
    background: transparent;
    border:none;
    color: var(--sand);
    font-size: 14.8px;
    padding: 8px 4px;
  }
  .note-input:focus{ outline:none; }
  .note-input::placeholder{ color: var(--sand-dim); }
  .note-del{
    background:none; border:none; color: var(--sand-dim);
    font-size: 16.3px; cursor:pointer; padding: 2px 6px;
  }
  .note-del:active{ color: var(--coral); }
  .note-add-row{
    display:flex;
    gap: 8px;
    margin-top: 12px;
  }
  .note-add-input{
    flex:1;
    background: var(--basalt-3);
    border: 1px solid var(--line);
    color: var(--sand);
    padding: 11px 13px;
    border-radius: 9px;
    font-size: 14.8px;
  }
  .note-add-input::placeholder{ color: var(--sand-dim); }
  .note-add-btn{
    background: var(--coral);
    color: #2A0E14;
    border:none;
    font-weight:800;
    font-size: 14.8px;
    padding: 0 16px;
    border-radius: 9px;
    cursor:pointer;
  }
  .note-freearea-label{
    font-size: 12.3px;
    color: var(--sand-dim);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-weight:700;
    margin: 18px 0 8px;
  }
  .note-freearea{
    width:100%;
    min-height: 160px;
    background: var(--basalt-3);
    border: 1px solid var(--line);
    color: var(--sand);
    border-radius: 10px;
    padding: 12px;
    font-size: 14.8px;
    line-height:1.6;
    font-family: inherit;
    resize: vertical;
  }
  .note-freearea:focus{ outline:none; border-color: var(--coral); }
  .note-freearea::placeholder{ color: var(--sand-dim); }

  /* ---- 동선 지도 ---- */
  .route-controls{
    display:flex;
    gap: 8px;
    flex-wrap:wrap;
    margin-bottom: 12px;
  }
  .rt-chip{
    font-size: 13.3px;
    font-weight:700;
    padding: 6px 12px;
    border-radius: 100px;
    background: var(--basalt-3);
    border: 1px solid var(--line);
    color: var(--sand-dim);
    cursor:pointer;
  }
  .rt-chip.on{
    background: var(--coral);
    color: #2A0E14;
    border-color: var(--coral);
  }
  .route-legend{
    display:flex;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .route-legend .lg{
    display:flex;
    align-items:center;
    gap:5px;
    font-size: 13.3px;
    font-weight:700;
    color: var(--sand-dim);
  }
  .route-legend .dot{
    width:9px; height:9px; border-radius:50%;
  }
  .route-map-wrap{
    background: var(--basalt-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px;
  }
  .route-hint{
    text-align:center;
    font-size: 12.8px;
    color: var(--sand-dim);
    margin-top:10px;
  }

  .home-note{
    padding: 20px 24px 0;
    text-align:center;
    font-size: 12.8px;
    color: var(--sand-dim);
  }
  .sync-dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background: var(--ocean); margin-right:5px;
  }

  /* ---- 상세 화면 ---- */
  .view{ display:none; padding: 14px 20px 0; }
  .view.active{ display:block; }

  .fixed-card{
    background: var(--basalt-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--ocean);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .fixed-card .tag{

function uid(){ return Math.random().toString(36).slice(2, 9); }

let applyingRemote = false;

async function loadState(){
  try{
    const snapshot = await db.ref(STORAGE_KEY).once('value');
    const val = snapshot.val();
    if(val){
      const parsed = JSON.parse(val);
      state = Object.assign(state, parsed);
    }
  }catch(e){
    console.error("불러오기 실패", e);
  }
  // 이전 버전(문자열 메모)에서 배열 구조로 마이그레이션
  if(typeof state.notes === "string"){
    state.notes = state.notes.trim() ? [{ id: uid(), text: state.notes.trim() }] : [];
  }
  render();

  // 다른 사람이 수정하면 실시간으로 반영
  db.ref(STORAGE_KEY).on('value', (snap) => {
    if(applyingRemote) return;
    const val = snap.val();
    if(val){
      applyingRemote = true;
      const parsed = JSON.parse(val);
      state = Object.assign({}, state, parsed);
      if(typeof state.notes === "string"){
        state.notes = state.notes.trim() ? [{ id: uid(), text: state.notes.trim() }] : [];
      }
      render();
      applyingRemote = false;
    }
  });
}

async function saveState(){
  try{
    await db.ref(STORAGE_KEY).set(JSON.stringify(state));
  }catch(e){
    console.error("저장 실패", e);
  }
}

    packing: { icon: svgIcon("backpack"), label:"준비물", sub:`${packDone}/${state.packing.length} 챙김`, css:"nc-pk", wide:false },
    notes: { icon: svgIcon("pencil"), label:"메모", sub:"자유롭게 적어두기", css:"nc-note", wide:false },
    route: { icon: svgIcon("compass"), label:"동선", sub:"제주 지도로 보기", css:"nc-route", wide:false },
    airport: { icon: svgIcon("plane"), label:"공항일정", sub:"항공편 상세 정보", css:"nc-airport", wide:false },
  };
  return meta[id] || null;
}

function renderHome(){
  const grid = document.getElementById("homeGrid");
  const utils = document.getElementById("homeUtils");
  const note = document.getElementById("homeNote");
  const topbar = document.getElementById("topbar");
  const quickTabs = document.getElementById("quickTabs");

  if(view !== "home"){
    grid.style.display = "none";
    utils.style.display = "none";
    note.style.display = "none";
    topbar.classList.add("show");
    quickTabs.classList.add("show");
    renderQuickTabs();
    return;
  }
  grid.style.display = "grid";
  utils.style.display = "block";
  note.style.display = "block";
  topbar.classList.remove("show");
  quickTabs.classList.remove("show");

  let html = "";
  state.menuOrder.forEach(id => {
    if(state.menuHidden[id]) return;
    const info = getMenuInfo(id);
    if(!info) return;
    if(info.wide){
      html += `
        <div class="nav-card ${info.css}" data-view="${id}">
          <div class="icon-row">
            <div class="icon-badge">${info.icon}</div>
            <div>
              <div class="lbl">${info.label}</div>
              <div class="sub">${info.sub}</div>
            </div>
          </div>
        </div>`;
    } else {
      html += `
        <div class="nav-card ${info.css}" data-view="${id}">
          ${info.badge ? `<div class="count">${info.badge}</div>` : ""}
          <div class="icon-badge">${info.icon}</div>
          <div class="lbl">${info.label}</div>
          <div class="sub">${info.sub}</div>
        </div>`;
    }
  });

  grid.innerHTML = html;
  grid.querySelectorAll(".nav-card").forEach(card => {
    card.onclick = () => goTo(card.dataset.view);
  });

  utils.innerHTML = `<div class="menu-admin-link" id="menuAdminLink">⚙️ 메뉴 순서·표시 설정</div>`;
  utils.querySelector("#menuAdminLink").onclick = () => goTo("menuAdmin");
}

function renderQuickTabs(){
  const quickTabs = document.getElementById("quickTabs");
  const labelMap = {
    overview: "🗓️ 전체",
    packing: "🎒 준비물",
    notes: "📝 메모",
    route: "🧭 동선",
    airport: "✈️ 공항",
  };
  const all = state.menuOrder
    .filter(id => !state.menuHidden[id])
    .map(id => {
      const day = DAYS.find(d => d.id === id);
      return { id, label: day ? day.label : (labelMap[id] || id) };
    });
  quickTabs.innerHTML = all.map(t =>
    `<div class="qtab ${t.id === view ? 'active' : ''}" data-view="${t.id}">${t.label}</div>`
  ).join("");
  quickTabs.querySelectorAll(".qtab").forEach(el => {
    el.onclick = () => goTo(el.dataset.view);
  });
}

function renderViews(){
  const container = document.getElementById("views");
  container.innerHTML = "";
  const titleEl = document.getElementById("viewTitle");

  if(view === "home"){ return; }

  if(view === "packing"){
    titleEl.textContent = "준비물";
    container.appendChild(buildPackingView());
    return;
  }

  if(view === "overview"){
    titleEl.textContent = "전체일정";
    container.appendChild(buildOverviewView());
    return;
  }

  if(view === "notes"){
    titleEl.textContent = "메모";
    container.appendChild(buildNotesView());
    return;
  }

  if(view === "route"){
    titleEl.textContent = "동선";
    container.appendChild(buildRouteView());
    return;
  }

  if(view === "airport"){
    titleEl.textContent = "공항일정";
    container.appendChild(buildAirportView());
    return;
  }

  if(view === "menuAdmin"){
    titleEl.textContent = "메뉴 설정";
    container.appendChild(buildMenuAdminView());
    return;
  }

  const d = DAYS.find(x => x.id === view);
  titleEl.textContent = `${d.label} · ${d.date}`;
  container.appendChild(buildDayView(d));
}

let editingItem = { day: null, id: null };

function buildDayView(d){
  const panel = document.createElement("div");
  panel.className = "view active";
  panel.id = "panel-" + d.id;

  let html = "";

  (FIXED[d.id] || []).forEach(f => {
    html += `
      <div class="fixed-card">
        <div class="tag">${f.tag}</div>
        <div class="ttl">${f.title}</div>
        <div class="meta">${f.meta}</div>
      </div>`;
  });

  if(d.id === "d1"){
    html += `
      <div class="fixed-card" style="border-left-color: var(--tangerine);">
        <div class="tag" style="color:var(--tangerine);">렌트카</div>
        <div class="rental-edit">
          <input id="rc-place" placeholder="픽업 장소 (예: 제주공항)" value="${state.rentalCar.place || ''}">
          <input id="rc-pickup" placeholder="픽업 시간 (예: 12:30)" value="${state.rentalCar.pickup || ''}">
          <input id="rc-return" placeholder="반납 시간 (예: 20:00)" value="${state.rentalCar.ret || ''}">
        </div>
      </div>`;
  }

  const items = (state.items[d.id] || []).slice().sort((a,b) => (a.time||"99:99").localeCompare(b.time||"99:99"));
  const editingHere = editingItem.day === d.id ? state.items[d.id].find(x => x.id === editingItem.id) : null;
  html += `<div class="section-label">일정</div>`;
  if(items.length === 0){
    html += `<div class="empty">아직 추가된 장소가 없어요.<br>아래에서 맛집이나 관광지를 채워보세요.</div>`;
  } else {
    items.forEach((it, idx) => {
      const isEditing = editingItem.day === d.id && editingItem.id === it.id;
      html += `
        <div class="item ${isEditing ? 'editing' : ''}" data-day="${d.id}" data-id="${it.id}" style="cursor:pointer; ${isEditing ? 'border-color:var(--tangerine);' : ''}">
          ${it.img ? `<img class="thumb" src="${escapeHtml(it.img)}" onerror="this.style.display='none'">` : ""}
          <div class="time">${it.time || "-"}</div>
          <div class="body">
            <span class="cat">${categoryLabel(it.cat)}</span>
            <div class="name">${escapeHtml(it.name)}</div>
            ${it.location ? `<div class="loc">📍 ${escapeHtml(it.location)}</div>` : ""}
            ${it.memo ? `<div class="memo">${escapeHtml(it.memo)}</div>` : ""}
          </div>
          <button class="del" data-day="${d.id}" data-id="${it.id}">✕</button>
        </div>`;
      if(idx < items.length - 1 && it.moveInfo){
        html += `
          <div class="connector">
            <span class="move-txt">🚗 ${escapeHtml(it.moveInfo)}</span>
          </div>`;
      }
    });
  }

  html += `
    <div class="add-form">
      ${editingHere ? `<div class="section-label" style="margin-top:0;color:var(--tangerine);">일정 수정 중</div>` : ""}
      <div class="row">
        <input class="w-time" data-field="time" data-day="${d.id}" placeholder="시간" value="${editingHere ? escapeHtml(editingHere.time || "") : ""}">
        <select class="w-cat" data-field="cat" data-day="${d.id}">
          <option value="food" ${editingHere && editingHere.cat === "food" ? "selected" : ""}>맛집</option>
          <option value="spot" ${editingHere && editingHere.cat === "spot" ? "selected" : ""}>관광지</option>
          <option value="etc" ${editingHere && editingHere.cat === "etc" ? "selected" : ""}>기타</option>
        </select>
      </div>
      <div class="row">
        <input data-field="name" data-day="${d.id}" placeholder="장소 이름" value="${editingHere ? escapeHtml(editingHere.name || "") : ""}">
      </div>
      <div class="row">
        <input data-field="location" data-day="${d.id}" placeholder="위치 (예: 애월읍, 제주시청 근처)" value="${editingHere ? escapeHtml(editingHere.location || "") : ""}">
      </div>
      <div class="row">
        <input data-field="memo" data-day="${d.id}" placeholder="메모 (선택)" value="${editingHere ? escapeHtml(editingHere.memo || "") : ""}">
      </div>
      <div class="row">
        <input data-field="moveInfo" data-day="${d.id}" placeholder="다음 장소까지 이동 (예: 차로 15분 · 8km)" value="${editingHere ? escapeHtml(editingHere.moveInfo || "") : ""}">
      </div>
      <div class="row">
        <input data-field="img" data-day="${d.id}" placeholder="이미지 링크 (선택, URL 붙여넣기)" value="${editingHere ? escapeHtml(editingHere.img || "") : ""}">
      </div>
      <button class="add-btn" data-day="${d.id}">${editingHere ? "수정 완료" : "+ 일정 추가"}</button>
      ${editingHere ? `<button class="add-btn" id="cancelEditBtn" style="background:var(--basalt-3); color:var(--sand); margin-top:6px;">취소</button>` : ""}
    </div>`;

  panel.innerHTML = html;

  const rcPlace = panel.querySelector("#rc-place");
  const rcPickup = panel.querySelector("#rc-pickup");
  const rcReturn = panel.querySelector("#rc-return");
  if(rcPlace){
    [rcPlace, rcPickup, rcReturn].forEach(inp => {
      inp.addEventListener("change", () => {
        state.rentalCar.place = rcPlace.value;
        state.rentalCar.pickup = rcPickup.value;
        state.rentalCar.ret = rcReturn.value;
        saveState();
      });
    });
  }

  panel.querySelectorAll(".item").forEach(row => {
    row.addEventListener("click", (e) => {
      if(e.target.closest(".del")) return;
      const day = row.dataset.day;
      const id = row.dataset.id;
      editingItem = (editingItem.day === day && editingItem.id === id) ? { day: null, id: null } : { day, id };
      renderViews();
      panel.querySelector(".add-form")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
  });

  panel.querySelectorAll(".del").forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const day = btn.dataset.day;
      const id = btn.dataset.id;
      state.items[day] = state.items[day].filter(x => x.id !== id);
      if(editingItem.day === day && editingItem.id === id) editingItem = { day: null, id: null };
      saveState();
      renderViews();
    };
  });

  const cancelBtn = panel.querySelector("#cancelEditBtn");
  if(cancelBtn){
    cancelBtn.onclick = () => {
      editingItem = { day: null, id: null };
      renderViews();
    };
  }

  const addBtn = panel.querySelector(".add-btn");
  addBtn.onclick = () => {
    const day = addBtn.dataset.day;
    const timeInp = panel.querySelector('[data-field="time"]');
    const catInp = panel.querySelector('[data-field="cat"]');
    const nameInp = panel.querySelector('[data-field="name"]');
    const locInp = panel.querySelector('[data-field="location"]');
    const memoInp = panel.querySelector('[data-field="memo"]');
    const moveInp = panel.querySelector('[data-field="moveInfo"]');
    const imgInp = panel.querySelector('[data-field="img"]');

    if(!nameInp.value.trim()){
      nameInp.focus();
      return;
    }

    if(editingItem.day === day && editingItem.id){
      const target = state.items[day].find(x => x.id === editingItem.id);
      if(target){
        target.time = timeInp.value.trim();
        target.cat = catInp.value;
        target.name = nameInp.value.trim();
        target.location = locInp.value.trim();
        target.memo = memoInp.value.trim();
        target.moveInfo = moveInp.value.trim();
        target.img = imgInp.value.trim();
      }
      editingItem = { day: null, id: null };
    } else {
      state.items[day].push({
        id: uid(),
        time: timeInp.value.trim(),
        cat: catInp.value,
        name: nameInp.value.trim(),
        location: locInp.value.trim(),
        memo: memoInp.value.trim(),
        moveInfo: moveInp.value.trim(),
        img: imgInp.value.trim()
      });
    }

    saveState();
    renderViews();
  };

  return panel;
}

function buildMenuAdminView(){
  const panel = document.createElement("div");
  panel.className = "view active";

  let html = `<div class="section-label">메뉴 순서 · 표시</div>`;

  state.menuOrder.forEach((id, idx) => {
    const info = getMenuInfo(id);
    if(!info) return;
    const hidden = !!state.menuHidden[id];
    html += `
      <div class="madmin-row ${hidden ? 'is-hidden' : ''}">
        <div class="madmin-icon">${info.icon}</div>
        <div class="madmin-label">${info.label}</div>
        <div class="madmin-controls">
          <button class="madmin-btn" data-action="up" data-idx="${idx}" ${idx === 0 ? 'disabled' : ''}>▲</button>
          <button class="madmin-btn" data-action="down" data-idx="${idx}" ${idx === state.menuOrder.length - 1 ? 'disabled' : ''}>▼</button>
          <button class="madmin-toggle ${hidden ? '' : 'on'}" data-action="toggle" data-idx="${idx}">${hidden ? '숨김' : '표시'}</button>
        </div>
      </div>`;
  });

  html += `<div class="madmin-hint">▲▼로 순서를 바꾸고, "표시/숨김" 버튼으로 홈 화면에서 잠깐 감출 수 있어요. 숨긴 항목도 여기서 언제든 다시 켤 수 있어요.</div>`;

  panel.innerHTML = html;

  panel.querySelectorAll(".madmin-btn, .madmin-toggle").forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx, 10);
      const action = btn.dataset.action;
      if(action === "up" && idx > 0){
        [state.menuOrder[idx - 1], state.menuOrder[idx]] = [state.menuOrder[idx], state.menuOrder[idx - 1]];
      } else if(action === "down" && idx < state.menuOrder.length - 1){
        [state.menuOrder[idx + 1], state.menuOrder[idx]] = [state.menuOrder[idx], state.menuOrder[idx + 1]];
      } else if(action === "toggle"){
        const id = state.menuOrder[idx];
        state.menuHidden[id] = !state.menuHidden[id];
      }
      saveState();
      renderViews();
    };
  });

  return panel;
}

function buildPackingView(){
  const panel = document.createElement("div");
  panel.className = "view active";

  let html = `<div class="section-label">체크리스트</div>`;
  if(state.packing.length === 0){
    html += `<div class="empty">아직 추가된 준비물이 없어요.</div>`;
  } else {
    state.packing.forEach(p => {
      html += `
        <div class="pack-item">
          <div class="pack-check ${p.checked ? 'checked' : ''}" data-id="${p.id}">${p.checked ? '✓' : ''}</div>
          <input class="pack-name-input ${p.checked ? 'done' : ''}" data-id="${p.id}" value="${escapeHtml(p.name)}">
          <button class="del" data-pack-id="${p.id}">✕</button>
        </div>`;
    });
  }
  html += `
    <div class="pack-form">
      <input id="pack-input" placeholder="준비물 입력 (예: 우산, 수영복)">
      <button class="pack-add" id="pack-add-btn">추가</button>
    </div>`;

  panel.innerHTML = html;

  panel.querySelectorAll(".pack-check").forEach(chk => {
    chk.onclick = () => {
      const item = state.packing.find(p => p.id === chk.dataset.id);
      item.checked = !item.checked;
      saveState();
      renderViews();
    };
  });

  panel.querySelectorAll(".pack-name-input").forEach(inp => {
    inp.addEventListener("change", () => {
      const item = state.packing.find(p => p.id === inp.dataset.id);
      if(item && inp.value.trim()){
        item.name = inp.value.trim();
        saveState();
      }
    });
  });

  panel.querySelectorAll("[data-pack-id]").forEach(btn => {
    btn.onclick = () => {
      state.packing = state.packing.filter(p => p.id !== btn.dataset.packId);
      saveState();
      renderViews();
    };
  });

  const addBtn = panel.querySelector("#pack-add-btn");
  const input = panel.querySelector("#pack-input");
  const doAdd = () => {
    if(!input.value.trim()) return;
    state.packing.push({ id: uid(), name: input.value.trim(), checked: false });
    saveState();
    renderViews();
  };
  addBtn.onclick = doAdd;
  input.addEventListener("keydown", (e) => { if(e.key === "Enter") doAdd(); });

  return panel;
}

let overviewDay = "";

function buildOverviewView(){
  const panel = document.createElement("div");
  panel.className = "view active";

  const anyOpen = !!overviewDay;

  let btnHtml = `<div class="ov-daybtns">`;
  DAYS.forEach(d => {
    const color = DAY_ROUTE_COLOR[d.id];
    const isSelected = d.id === overviewDay;
    btnHtml += `<div class="ov-daybtn ${isSelected ? 'active' : ''}" data-day="${d.id}" style="--tab-color:${color};">${d.label}</div>`;
  });
  btnHtml += `</div>`;

  let html = btnHtml + `<div class="ov-panels ${anyOpen ? 'expanded' : 'equal'}">`;

  DAYS.forEach(d => {
    const color = DAY_ROUTE_COLOR[d.id];
    const isSelected = d.id === overviewDay;
    const isCollapsed = anyOpen && !isSelected;
    const items = (state.items[d.id] || []).slice().sort((a,b) => (a.time||"99:99").localeCompare(b.time||"99:99"));
    const count = items.length + (FIXED[d.id] || []).length;

    if(isCollapsed){
      html += `
        <div class="ov-panel" data-day="${d.id}" style="--tab-color:${color};">
          <div class="ov-panel-collapsed">
            <span>${d.label}</span>
            <span class="ov-panel-date">${d.date}</span>
            <span class="ov-panel-count">${count}개</span>
          </div>
        </div>`;
      return;
    }

    const rows = [];
    (FIXED[d.id] || []).forEach(f => {
      rows.push({ time: f.meta.split(' ')[0], name: f.title, loc: "", memo: "" });
    });
    items.forEach(it => {
      rows.push({ time: it.time || "-", name: it.name, loc: it.location || "", memo: it.memo || "" });
    });

    let rowsHtml = "";
    if(rows.length === 0){
      rowsHtml = `<div class="ovi-empty">아직 일정 없음</div>`;
    } else {
      rows.forEach(r => {
        rowsHtml += `
          <div class="tl-row" style="--dot-color:${color};">
            <div class="tl-time">${r.time}</div>
            <div class="tl-name">${escapeHtml(r.name)}</div>
            ${r.loc ? `<div class="tl-loc">📍 ${escapeHtml(r.loc)}</div>` : ""}
            ${r.memo ? `<div class="tl-memo">${escapeHtml(r.memo)}</div>` : ""}
          </div>`;
      });
    }

    html += `
      <div class="ov-panel ${isSelected ? 'open' : ''}" data-day="${d.id}" style="--tab-color:${color};">
        <div class="ov-panel-head" data-day="${d.id}">
          <span class="ov-panel-badge">${d.label}</span>
          <span class="ov-panel-date">${d.date}</span>
          ${isSelected ? `<span class="ov-panel-close">✕</span>` : ""}
        </div>
        <div class="ov-panel-body"><div class="tl-line">${rowsHtml}</div></div>
      </div>`;
  });

  html += `</div>`;
  panel.innerHTML = html;

  panel.querySelectorAll(".ov-daybtn").forEach(el => {
    el.onclick = () => {
      const day = el.dataset.day;
      overviewDay = (overviewDay === day) ? "" : day;
      renderViews();
    };
  });

  panel.querySelectorAll(".ov-panel:not(.open)").forEach(el => {
    el.onclick = () => {
      overviewDay = el.dataset.day;
      renderViews();
    };
  });

  panel.querySelectorAll(".ov-panel-head").forEach(el => {
    el.onclick = () => {
      overviewDay = "";
      renderViews();
    };
  });

  const extra = document.createElement("div");
  extra.className = "ov-extra";
  extra.appendChild(buildOvCollapse("packing", "🎒", "준비물", buildPackingView));
  extra.appendChild(buildOvCollapse("notes", "📝", "메모", buildNotesView));
  panel.appendChild(extra);

  return panel;
}

let ovExtraOpen = { packing: false, notes: false };

function buildOvCollapse(key, icon, title, contentFn){
  const isOpen = !!ovExtraOpen[key];
  const wrap = document.createElement("div");
  wrap.className = "ov-collapse" + (isOpen ? " open" : "");

  const head = document.createElement("div");
  head.className = "ov-collapse-head";
  head.innerHTML = `
    <span class="ov-collapse-icon">${icon}</span>
    <span class="ov-collapse-title">${title}</span>
    <span class="ov-collapse-chevron">${isOpen ? '▲' : '▼'}</span>`;
  head.onclick = () => {
    ovExtraOpen[key] = !ovExtraOpen[key];
    renderViews();
  };
  wrap.appendChild(head);

  if(isOpen){
    const body = document.createElement("div");
    body.className = "ov-collapse-body";
    body.appendChild(contentFn());
    wrap.appendChild(body);
  }

  return wrap;
}

function buildNotesView(){

  panel.innerHTML = `

      <div class="note-header">
        <span class="note-header-icon">📝</span>
        <span class="note-header-title">자유 메모</span>

        <input class="note-add-input" id="noteAddInput" placeholder="숙소 정보, 예약번호, 챙길 얘기 등 한 줄씩 추가">

    </div>`;

  const freeArea = panel.querySelector("#noteFreeArea");
  freeArea.addEventListener("change", () => {
    state.freeNote = freeArea.value;
    saveState();
  });

  panel.querySelectorAll(".note-input").forEach(inp => {
    inp.addEventListener("change", () => {
      const n = state.notes.find(x => x.id === inp.dataset.id);
      if(n){ n.text = inp.value; saveState(); }
    });
  });

  panel.querySelectorAll(".note-del").forEach(btn => {
    btn.onclick = () => {
      state.notes = state.notes.filter(x => x.id !== btn.dataset.id);
      saveState();
      renderViews();
    };
  });

  const addInput = panel.querySelector("#noteAddInput");
  const addBtn = panel.querySelector("#noteAddBtn");
  const doAdd = () => {
    if(!addInput.value.trim()) return;
    state.notes.push({ id: uid(), text: addInput.value.trim() });
    saveState();
    renderViews();
  };
  addBtn.onclick = doAdd;
  addInput.addEventListener("keydown", (e) => { if(e.key === "Enter") doAdd(); });

  return panel;
}

function project(lat, lng){
  const KM_LAT = 111;
  const KM_LNG = 111 * Math.cos(33.4 * Math.PI / 180);
  const PX_PER_KM = 4.5;
  const x = 34 + (lng - 126.09) * KM_LNG * PX_PER_KM;
  const y = 24 + (33.615 - lat) * KM_LAT * PX_PER_KM;
  return { x, y };
}

function haversineKm(a, b){
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function smoothClosedPath(points){
  const pts = points.map(p => project(p.lat, p.lng));
  let d = `M ${(pts[0].x+pts[pts.length-1].x)/2} ${(pts[0].y+pts[pts.length-1].y)/2}`;
  for(let i=0;i<pts.length;i++){
    const p0 = pts[i];
    const p1 = pts[(i+1) % pts.length];
    const mid = { x:(p0.x+p1.x)/2, y:(p0.y+p1.y)/2 };
    d += ` Q ${p0.x} ${p0.y} ${mid.x} ${mid.y}`;
  }
  return d + " Z";
}

function matchZone(item){
  const text = ((item.location || "") + " " + (item.name || "")).toLowerCase();
  return ZONES.find(z => z.match.some(m => text.includes(m.toLowerCase())));
}

// 같은 구역이 연속으로 나오면 하나로 합쳐서 0km 라벨이 겹치는 걸 방지
function dedupeZones(zonePoints){
  const out = [];
  zonePoints.forEach(z => {
    if(out.length === 0 || out[out.length-1].key !== z.key) out.push(z);
  });
  return out;
}

let routeToggles = { dist: true, time: true, zoneLabels: true };
let dayToggles = { d1: true, d2: true, d3: true };

function buildRouteView(){
  const panel = document.createElement("div");
  panel.className = "view active";

  let dayChipsHtml = `<div class="route-controls">`;
  DAYS.forEach(d => {
    const on = dayToggles[d.id];
    const color = DAY_ROUTE_COLOR[d.id];
    dayChipsHtml += `<div class="rt-chip day-chip ${on ? 'on' : ''}" data-day="${d.id}" style="${on ? `background:${color};color:#1B0F06;border-color:${color};` : ''}">${on ? '✓ ' : ''}${d.label}</div>`;
  });
  dayChipsHtml += `</div>`;

  let controlsHtml = `<div class="route-controls">`;
  const toggleDefs = [
    { key:"dist", label:"거리(km)" },
    { key:"time", label:"시간(분)" },
    { key:"zoneLabels", label:"위치 라벨" },
  ];
  toggleDefs.forEach(t => {
    controlsHtml += `<div class="rt-chip ${routeToggles[t.key] ? 'on' : ''}" data-key="${t.key}">${routeToggles[t.key] ? '✓ ' : ''}${t.label}</div>`;
  });
  controlsHtml += `</div>`;

  let legendHtml = `<div class="route-legend">`;
  DAYS.forEach(d => {
    if(!dayToggles[d.id]) return;
    const items = (state.items[d.id] || []).slice().sort((a,b) => (a.time||"99:99").localeCompare(b.time||"99:99"));
    const zonePoints = dedupeZones(items.map(matchZone).filter(Boolean));
    let total = 0;
    for(let i=0;i<zonePoints.length-1;i++){
      total += haversineKm(zonePoints[i], zonePoints[i+1]);
    }
    const totalMins = Math.round(total / 40 * 60);
    let legendExtra = "";
    if(total > 0){
      const parts = [];
      if(routeToggles.dist) parts.push(`약 ${total.toFixed(1)}km`);
      if(routeToggles.time) parts.push(`${totalMins}분`);
      if(parts.length) legendExtra = ` · ${parts.join(' · ')}`;
    }
    legendHtml += `<div class="lg"><span class="dot" style="background:${DAY_ROUTE_COLOR[d.id]}"></span>${d.label}${legendExtra}</div>`;
  });
  legendHtml += `</div>`;

  let pathsSvg = "";
  let pinsSvg = "";
  let distLabelsSvg = "";
  DAYS.forEach(d => {
    if(!dayToggles[d.id]) return;
    const items = (state.items[d.id] || []).slice().sort((a,b) => (a.time||"99:99").localeCompare(b.time||"99:99"));
    const zonePoints = dedupeZones(items.map(matchZone).filter(Boolean));
    const pxPoints = zonePoints.map(z => project(z.lat, z.lng));

    if(pxPoints.length > 1){
      const pts = pxPoints.map(p => `${p.x},${p.y}`).join(" ");
      pathsSvg += `<polyline points="${pts}" fill="none" stroke="${DAY_ROUTE_COLOR[d.id]}" stroke-width="2" stroke-dasharray="4 3" opacity="0.9"/>`;

      for(let i=0;i<pxPoints.length-1;i++){
        const km = haversineKm(zonePoints[i], zonePoints[i+1]);
        const mins = Math.max(3, Math.round(km / 40 * 60 / 5) * 5); // 평균 40km/h 가정, 5분 단위 반올림
        const parts = [];
        if(routeToggles.dist) parts.push(`${km.toFixed(1)}km`);
        if(routeToggles.time) parts.push(`${mins}분`);
        if(parts.length){
          const label = parts.join(' · ');
          const mx = (pxPoints[i].x + pxPoints[i+1].x) / 2;
          const my = (pxPoints[i].y + pxPoints[i+1].y) / 2;
          const boxW = label.length * 4.1 + 8;
          distLabelsSvg += `
            <rect x="${mx-boxW/2}" y="${my-6}" width="${boxW}" height="11" rx="5.5" fill="var(--basalt)" opacity="0.85"/>
            <text x="${mx}" y="${my+2}" font-size="6.8" font-weight="700" fill="${DAY_ROUTE_COLOR[d.id]}" text-anchor="middle">${label}</text>`;
        }
      }
    }
    pxPoints.forEach(p => {
      pinsSvg += `<circle cx="${p.x}" cy="${p.y}" r="7" fill="${DAY_ROUTE_COLOR[d.id]}" stroke="var(--basalt)" stroke-width="1.5"/>`;
    });
  });

  let labelsSvg = "";
  ZONES.forEach(z => {
    const p = project(z.lat, z.lng);
    labelsSvg += `<circle cx="${p.x}" cy="${p.y}" r="2.2" fill="var(--sand-dim)" opacity="0.6"/>`;
    if(routeToggles.zoneLabels){
      const lx = p.x + (z.dx || 0);
      const ly = p.y + (z.dy !== undefined ? z.dy : -9);
      const boxW = z.label.length * 6.8 + 6;
      labelsSvg += `
        <rect x="${lx-boxW/2}" y="${ly-8}" width="${boxW}" height="11" rx="4" fill="var(--basalt-3)" opacity="0.9"/>
        <text x="${lx}" y="${ly+1}" font-size="8" fill="var(--sand-dim)" text-anchor="middle">${z.label}</text>`;
    }
  });

  const islandPath = smoothClosedPath(COAST_POINTS);
  const udoPath = smoothClosedPath(UDO_COAST);

  const svg = `
    <svg viewBox="0 0 430 270" style="width:100%; height:auto;">
      <path d="${islandPath}" fill="var(--basalt-3)" stroke="var(--line)" stroke-width="1.5"/>
      <path d="${udoPath}" fill="var(--basalt-3)" stroke="var(--line)" stroke-width="1.2"/>
      ${labelsSvg}
      ${pathsSvg}
      ${distLabelsSvg}
      ${pinsSvg}
    </svg>`;

  function naverDirUrl(fromZone, fromName, toZone, toName){
    const sname = encodeURIComponent(fromName);
    const ename = encodeURIComponent(toName);
    return `https://m.map.naver.com/route.nhn?menu=route&sname=${sname}&sx=${fromZone.lng}&sy=${fromZone.lat}&ename=${ename}&ex=${toZone.lng}&ey=${toZone.lat}&pathType=0&showMap=true`;
  }

  function kakaoDirUrl(fromZone, fromName, toZone, toName){
    const f = encodeURIComponent(fromName);
    const t = encodeURIComponent(toName);
    return `https://map.kakao.com/link/from/${f},${fromZone.lat},${fromZone.lng}/to/${t},${toZone.lat},${toZone.lng}`;
  }

  let placesListHtml = "";
  DAYS.forEach(d => {
    if(!dayToggles[d.id]) return;
    const items = (state.items[d.id] || []).slice().sort((a,b) => (a.time||"99:99").localeCompare(b.time||"99:99"));
    if(items.length === 0) return;
    const color = DAY_ROUTE_COLOR[d.id];
    placesListHtml += `<div class="ov-collapse" style="margin-bottom:10px;"><div class="ov-collapse-head" style="cursor:default;"><span class="ov-collapse-icon" style="color:${color};">●</span><span class="ov-collapse-title">${d.label} 방문 순서</span></div><div class="ov-collapse-body" style="padding-top:0;">`;
    items.forEach((it, idx) => {
      placesListHtml += `<div style="font-size:13.8px; padding:6px 0; ${idx < items.length-1 ? 'border-bottom:1px dashed var(--line);' : ''}">${idx+1}. ${escapeHtml(it.name)}${it.location ? ` <span style="color:var(--sand-dim); font-size:12.3px;">(${escapeHtml(it.location)})</span>` : ""}</div>`;
      if(idx < items.length - 1){
        const nextIt = items[idx+1];
        const fromZone = matchZone(it);
        const toZone = matchZone(nextIt);
        if(fromZone && toZone){
          placesListHtml += `<div style="display:flex; gap:10px; flex-wrap:wrap; padding:4px 0 10px;">
          <a href="${naverDirUrl(fromZone, it.name, toZone, nextIt.name)}" target="_blank" rel="noopener" style="font-size:12.3px; color:${color}; text-decoration:none; font-weight:700;">🟢 네이버지도 →</a>
          <a href="${kakaoDirUrl(fromZone, it.name, toZone, nextIt.name)}" target="_blank" rel="noopener" style="font-size:12.3px; color:${color}; text-decoration:none; font-weight:700;">🟡 카카오맵 →</a></div>`;
        }
      }
    });
    placesListHtml += `</div></div>`;
  });

  panel.innerHTML = `
    <div class="section-label">방문 동선</div>
    ${dayChipsHtml}
    ${controlsHtml}
    ${legendHtml}
    <div class="route-map-wrap">${svg}</div>
    <div class="route-hint">지도 위 표시는 대략적인 구역 기준 스케치예요. 아래 "실제 방문 장소" 목록에서 네이버지도/카카오맵 링크를 누르면 실시간 교통이 반영된 정확한 경로와 시간을 각 앱에서 확인할 수 있어요. (구역 대표 좌표 기준이라 정확한 출발지와 약간 다를 수 있어요)</div>
    <div class="section-label" style="margin-top:20px;">실제 방문 장소</div>
    ${placesListHtml}`;

  panel.querySelectorAll(".day-chip").forEach(chip => {
    chip.onclick = () => {
      const day = chip.dataset.day;
      dayToggles[day] = !dayToggles[day];
      renderViews();
    };
  });

  panel.querySelectorAll(".rt-chip:not(.day-chip)").forEach(chip => {
    chip.onclick = () => {
      const key = chip.dataset.key;
      routeToggles[key] = !routeToggles[key];
      renderViews();
    };
  });

  return panel;
}

    let html = "";
    if(data.current){
      html += `
        <div class="weather-current">
          <span class="wc-icon">${weatherIcon(data.current.weather_code)}</span>
          <div>
            <div class="wc-temp">${Math.round(data.current.temperature_2m)}°C</div>
            <div class="wc-label">지금 제주 · ${weatherLabel(data.current.weather_code)}</div>
          </div>
        </div>`;
    }

    if(data.daily && data.daily.time){
      tripDates.forEach((date, idx) => {
        const dIdx = data.daily.time.indexOf(date);
        if(dIdx === -1) return;
        const code = data.daily.weather_code[dIdx];
        const hi = Math.round(data.daily.temperature_2m_max[dIdx]);
        const lo = Math.round(data.daily.temperature_2m_min[dIdx]);
        const rain = data.daily.precipitation_probability_max[dIdx];
        html += `
          <div class="weather-day">
            <div class="wd-label">${tripLabels[idx]}</div>
            <div class="wd-icon">${weatherIcon(code)}</div>
            <div class="wd-temp">${hi}° <span class="lo">${lo}°</span></div>
            ${rain !== undefined ? `<div class="wd-rain">💧${rain}%</div>` : ""}
          </div>`;
      });
    }

    el.innerHTML = html || `<div class="weather-loading">날씨 정보를 가져오지 못했어요</div>`;
  }catch(e){
    el.innerHTML = `<div class="weather-loading">날씨 정보를 가져오지 못했어요</div>`;
  }
}

loadState();
loadWeather();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err => console.log("SW 등록 실패", err));
  });
}

</script>

</body>
</html>
